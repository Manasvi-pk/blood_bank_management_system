spring.application.name=blood-donor-management-system
server.port=8080

# Optional, ignored local file for database credentials.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blood_donor_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No entity/table model is part of this foundation step.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
