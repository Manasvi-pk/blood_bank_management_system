<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="topbar(pageTitle)">
    <div class="topbar-left">
        <button class="menu-button" type="button" data-menu-button
                aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="breadcrumb">
            <span>Workspace</span>
            <span class="breadcrumb-divider" aria-hidden="true">/</span>
            <strong th:text="${pageTitle}">Dashboard</strong>
        </div>
    </div>
    <div class="topbar-right">
        <span class="prototype-chip"><span aria-hidden="true"></span> Prototype</span>
    </div>
</header>
</body>
</html>
