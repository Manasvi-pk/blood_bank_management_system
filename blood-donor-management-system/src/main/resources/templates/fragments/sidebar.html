<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" id="sidebar" th:fragment="sidebar(activePage)">
    <a class="sidebar-brand" th:href="@{/dashboard}" aria-label="HemoCare dashboard">
        <span class="brand-symbol" aria-hidden="true">
            <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="" width="38" height="38">
        </span>
        <span class="brand-wordmark">
            <strong>HemoCare</strong>
            <small>Blood bank system</small>
        </span>
    </a>

    <span class="nav-caption">WORKSPACE</span>
    <nav class="primary-nav" aria-label="Main navigation">
        <a class="nav-link" th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'dashboard' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Dashboard</span>
        </a>
        <a class="nav-link" th:href="@{/donors}"
           th:classappend="${activePage == 'donors'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'donors' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="4"/><path d="M17 11.5a4 4 0 0 0 0-8m4 16.5v-1.5a4 4 0 0 0-3-3.87"/></svg>
            <span>Donors</span>
            <span class="nav-count" th:text="${#numbers.formatInteger(donorCount, 1, 'COMMA')}">0</span>
        </a>
        <a class="nav-link" th:href="@{/recipients}"
           th:classappend="${activePage == 'recipients'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'recipients' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9m0 0 3-3m-3 3 3 3"/><path d="M4 17h9m0 0-3-3m3 3-3 3"/></svg>
            <span>Recipients</span>
        </a>
        <a class="nav-link" th:href="@{/donations}"
           th:classappend="${activePage == 'donations'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'donations' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.1-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.9-7 10-7 10Z"/><path d="M12 9v6m-3-3h6"/></svg>
            <span>Donation records</span>
        </a>
        <a class="nav-link" th:href="@{/inventory}"
           th:classappend="${activePage == 'inventory'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'inventory' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 21v-8.8m-4-6 8 4.5"/></svg>
            <span>Blood inventory</span>
        </a>
        <a class="nav-link" th:href="@{/requests}"
           th:classappend="${activePage == 'requests'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'requests' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l4 4v12H4V4h4Zm7 0v5h5M8 13h8m-8 4h5"/></svg>
            <span>Blood requests</span>
            <span class="nav-alert" aria-label="12 sample pending requests">12</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="sidebar-note">
            <span class="sidebar-note-mark" aria-hidden="true">i</span>
            <p>Sample data only.<br>No records are stored.</p>
        </div>
        <a class="nav-link login-nav-link" th:href="@{/login}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
            <span>Login screen</span>
        </a>
        <div class="sidebar-user">
            <span class="user-avatar" aria-hidden="true">AD</span>
            <span class="user-copy"><strong>Demo account</strong><small>Prototype profile</small></span>
            <span class="user-menu-dots" aria-hidden="true">···</span>
        </div>
    </div>
</aside>
</body>
</html>
