
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('Donor management', 'donors', ~{::pageContent})}">

<section th:fragment="pageContent" class="page-section">

    <div class="page-heading">
        <div>
            <p class="eyebrow">PEOPLE</p>
            <h1>Donor management</h1>
            <p class="page-description">Register donors and view saved donor records.</p>
        </div>

        <button class="button button-primary" type="button"
                data-panel-toggle="#donor-form" aria-expanded="false">
            + Register donor
        </button>
    </div>

    <p th:if="${successMessage}" th:text="${successMessage}"
       role="status"></p>

    <section class="form-card" id="donor-form"
             aria-labelledby="donor-form-heading" hidden>

        <div class="form-heading">
            <div>
                <h2 id="donor-form-heading">Register a donor</h2>
                <p>Enter the donor's details below.</p>
            </div>
        </div>

        <form class="record-form" th:action="@{/donors}"
              th:object="${donor}" method="post">

            <label class="field">
                <span>Full name</span>
                <input type="text" th:field="*{name}"
                       placeholder="Enter full name" required>
            </label>

            <label class="field">
                <span>Blood group</span>
                <select th:field="*{bloodGroup}" required>
                    <option value="">Choose a group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </label>

            <label class="field">
                <span>Email address</span>
                <input type="email" th:field="*{email}"
                       placeholder="Enter email address" required>
            </label>

            <label class="field">
                <span>Area or city</span>
                <input type="text" th:field="*{area}"
                       placeholder="Enter area or city" required>
            </label>

            <div class="form-actions">
                <p class="form-hint">Donor details will be saved to the database.</p>
                <button class="button button-primary" type="submit">
                    Save donor
                </button>
            </div>
        </form>
    </section>

    <section class="content-card table-card"
             aria-labelledby="donors-table-heading">

        <div class="section-heading table-toolbar">
            <div>
                <h2 id="donors-table-heading">Donor registry</h2>
                <p>Donors saved in your database</p>
            </div>
            <label class="search-field">
                <span class="visually-hidden">Search donors</span>
                <input type="search" id="donor-search" placeholder="Search donors...">
            </label>
        </div>

        <div class="table-scroll">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col">Donor</th>
                        <th scope="col">Blood group</th>
                        <th scope="col">Email</th>
                        <th scope="col">Area</th>
                    </tr>
                </thead>

                <tbody id="donor-table-body" data-sample-table="donors" data-database-table="true">
                    <tr th:each="donor : ${donors}">
                        <td th:text="${donor.name}"></td>
                        <td><span class="blood-group-badge" th:text="${donor.bloodGroup}"></span></td>
                        <td th:text="${donor.email}"></td>
                        <td th:text="${donor.area}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(donors)}">
                        <td colspan="4">No donors registered yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const search = document.getElementById('donor-search');
            const body = document.getElementById('donor-table-body');
            if (!search || !body) return;

            search.addEventListener('input', function () {
                const query = search.value.toLowerCase();
                body.querySelectorAll('tr').forEach(function (row) {
                    if (row.cells.length > 1) {
                        row.hidden = !row.textContent.toLowerCase().includes(query);
                    }
                });
            });
        });
    </script>

</section>
</html>
